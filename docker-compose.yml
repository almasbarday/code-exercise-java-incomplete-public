services:
  api:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_PATH: /data/urlshortener.db
      SERVER_PORT: 8080
    volumes:
      - sqlite_data:/data
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - app-network

volumes:
  sqlite_data:

networks:
  app-network:
    driver: bridge
